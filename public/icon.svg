<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Smooth rounded background matching standard Android adaptive launcher icon look -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="linear-gradient(135deg, #059669 0%, #10b981 100%)" />
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#022c22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#065f46;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#011f18" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer rounded plate -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#grad)" />
  
  <!-- Ledger Cover Art -->
  <g filter="url(#shadow)">
    <!-- Ledger Spine / Binding -->
    <rect x="130" y="120" width="35" height="272" rx="6" fill="#047857" />
    <rect x="130" y="160" width="35" height="15" fill="#059669" />
    <rect x="130" y="240" width="35" height="15" fill="#059669" />
    <rect x="130" y="320" width="35" height="15" fill="#059669" />

    <!-- Ledger Cover Page -->
    <rect x="165" y="120" width="215" height="272" rx="12" fill="url(#iconGrad)" />
    
    <!-- White Inner Notebook lines represent ledger sheet -->
    <rect x="195" y="155" width="155" height="20" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="195" y="195" width="155" height="8" rx="2" fill="#d1fae5" opacity="0.8" />
    <rect x="195" y="220" width="120" height="8" rx="2" fill="#d1fae5" opacity="0.8" />
    
    <!-- Indian Rupee emblem styled in gold/yellow for a direct Ledger/Rojmel feel -->
    <circle cx="272" cy="295" r="42" fill="#f59e0b" />
    <circle cx="272" cy="295" r="36" fill="#34d399" />
    
    <!-- Rupee Text Symbol -->
    <path d="M262 278 h22 M262 284 h22 M266 278 c8 0, 15 4, 15 11 c0 7, -7 11, -15 11 h-4 l13 18" 
          stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
